# Domain manifest. The orchestrator, the web UI and the assembler all read this
# file; none of them hardcodes anything about this domain. Adding a new domain
# means adding a manifest here and a package under
# src/protocol_to_edc/domains/<id>/ -- nothing else changes.

id: study_intervention
order: 5
label: "Study Intervention"
description: >-
  Investigational products and comparators: name, type, role, dose, route.

usdm:
  version_range: ">=4.0.0"
  produces:
    - StudyIntervention
    - Administration
    - Quantity
  # Where this domain's fragment is placed in the assembled document.
  attaches_to: "studyVersion.studyInterventions"

# Domains whose output this one needs as context. Everything with the same
# dependencies runs concurrently.
depends_on: []

skill:
  file: "src/protocol_to_edc/domains/study_intervention/skill.md"
  # Sections sliced out of USDM-IG.pdf and loaded into this agent's prompt.
  ig_sections:
    - StudyIntervention
    - Administration
    - AdministrableProduct
    - Quantity
  # Codelists offered to the agent as permitted values.
  ct_codelists:
    - StudyIntervention.role
    - StudyIntervention.type
    - Administration.route
    - Administration.frequency
    - Quantity.unit

# Hints about where in a protocol this information usually lives.
protocol_hints:
    - Sections on study drug, investigational product, treatments administered
    - Dose, dosage form, route and regimen tables
    - Comparator and placebo description
    - Synopsis: treatment summary

llm:
  model: null      # null inherits config/default.yaml
  effort: null
