# Domain manifest. The orchestrator, the web UI and the assembler all read this
# file; none of them hardcodes anything about this domain. Adding a new domain
# means adding a manifest here and a package under
# src/protocol_to_edc/domains/<id>/ -- nothing else changes.

id: population_eligibility
order: 7
label: "Population & Eligibility"
description: >-
  Planned population and the inclusion and exclusion criteria.

usdm:
  version_range: ">=4.0.0"
  produces:
    - StudyDesignPopulation
    - StudyCohort
    - EligibilityCriterion
    - EligibilityCriterionItem
  # Where this domain's fragment is placed in the assembled document.
  attaches_to: "studyDesign.population"

# Domains whose output this one needs as context. Everything with the same
# dependencies runs concurrently.
depends_on: []

skill:
  file: "src/protocol_to_edc/domains/population_eligibility/skill.md"
  # Sections sliced out of USDM-IG.pdf and loaded into this agent's prompt.
  ig_sections:
    - StudyDesignPopulation
    - StudyCohort
    - EligibilityCriterion
    - EligibilityCriterionItem
    - Range
  # Codelists offered to the agent as permitted values.
  ct_codelists:
    - StudyDesignPopulation.plannedSex
    - EligibilityCriterion.category

# Hints about where in a protocol this information usually lives.
protocol_hints:
    - Sections titled 'Inclusion Criteria' and 'Exclusion Criteria'
    - Study population section: planned enrolment, age range, sex
    - Synopsis: number of subjects

llm:
  model: null      # null inherits config/default.yaml
  effort: null
