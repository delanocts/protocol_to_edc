# Domain manifest. The orchestrator, the web UI and the assembler all read this
# file; none of them hardcodes anything about this domain. Adding a new domain
# means adding a manifest here and a package under
# src/protocol_to_edc/domains/<id>/ -- nothing else changes.

id: study_design
order: 2
label: "Study Design"
description: >-
  Design classification: study type, intervention model, blinding, phase, intent.

usdm:
  version_range: ">=4.0.0"
  produces:
    - InterventionalStudyDesign
  # Where this domain's fragment is placed in the assembled document.
  attaches_to: "studyDesign.characteristics"

# Domains whose output this one needs as context. Everything with the same
# dependencies runs concurrently.
depends_on: []

skill:
  file: "src/protocol_to_edc/domains/study_design/skill.md"
  # Sections sliced out of USDM-IG.pdf and loaded into this agent's prompt.
  ig_sections:
    - StudyDesign
    - InterventionalStudyDesign
    - Masking
    - AliasCode
  # Codelists offered to the agent as permitted values.
  ct_codelists:
    - InterventionalStudyDesign.studyType
    - InterventionalStudyDesign.model
    - InterventionalStudyDesign.studyPhase
    - InterventionalStudyDesign.blindingSchema
    - InterventionalStudyDesign.intentTypes
    - InterventionalStudyDesign.subTypes
    - InterventionalStudyDesign.characteristics

# Hints about where in a protocol this information usually lives.
protocol_hints:
    - Synopsis: study design / overall design
    - Section titled 'Study Design' or 'Overall Design'
    - Study schematic or design diagram
    - Randomisation and blinding sections

llm:
  model: null      # null inherits config/default.yaml
  effort: null
